[project]
name = "open-publisher-agent-runtime"
version = "0.1.0"
description = "Local-first AI and publishing runtime for Open Publisher"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0.36,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=1.0,<2",
]
dev = [
    "jsonschema>=4.23,<5",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[project.scripts]
open-publisher-agent-runtime = "open_publisher_runtime.main:run"
open-publisher-content-package = "open_publisher_runtime.content_package_cli:main"
open-publisher-real-e2e = "open_publisher_runtime.real_e2e:main"
open-publisher-real-api-e2e = "open_publisher_runtime.real_api_e2e:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_publisher_runtime"]
include = [
    "src/open_publisher_runtime/resources/**/*.md",
    "src/open_publisher_runtime/resources/**/LICENSE",
    "src/open_publisher_runtime/resources/**/REVISION",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
