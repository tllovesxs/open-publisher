[project]
name = "open-publisher-workspace"
version = "0.1.0"
description = "Development workspace for Open Publisher"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests", "services/agent-runtime/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["D:/code/发文/AIWriteX"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

