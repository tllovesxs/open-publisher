<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Publisher 草稿助手</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <h1>安全草稿助手</h1>
      <p id="status" class="status" role="status">正在读取状态…</p>

      <label for="nonce">桌面端配对码</label>
      <input
        id="nonce"
        type="password"
        minlength="32"
        maxlength="128"
        autocomplete="off"
        spellcheck="false"
        placeholder="32–128 位配对码"
      />
      <button id="pair" type="button">配对当前扩展</button>

      <hr />

      <label for="title">模拟草稿标题</label>
      <input id="title" maxlength="500" value="Open Publisher 安全草稿测试" />
      <label for="body">模拟草稿正文</label>
      <textarea id="body" rows="6">这是一段仅填入编辑器、不会自动发布的测试草稿。</textarea>
      <button id="fill" type="button">填充草稿（不发布）</button>
      <p class="notice">扩展不会读取或导出 Cookie，也不会点击最终发布按钮。</p>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
